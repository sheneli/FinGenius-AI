name: fingenius_ai
description: "FinGenius AI — Intelligent Personal Finance Management and Financial Wellness Companion."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

# NOTE: constraints reflect latest known-good majors; the build environment had no
# pub.dev access. Run `flutter pub upgrade --major-versions` before first build.
# Justifications: docs/dependency_decisions.md
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  go_router: ^14.6.0

  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.0
  firebase_messaging: ^15.1.5
  firebase_analytics: ^11.3.5
  firebase_crashlytics: ^4.1.5
  firebase_remote_config: ^5.1.5
  firebase_app_check: ^0.3.1
  firebase_ai: ^2.0.0

  google_mlkit_text_recognition: ^0.14.0
  speech_to_text: ^7.0.0
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2
  hive_ce: ^2.10.0
  hive_ce_flutter: ^2.2.0
  connectivity_plus: ^6.1.0
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  flutter_image_compress: ^2.3.0
  image_cropper: ^8.0.2
  cached_network_image: ^3.4.1
  flutter_local_notifications: ^18.0.1
  fl_chart: ^0.69.0
  flutter_svg: ^2.0.10
  google_fonts: ^6.2.1
  # flutter_localizations pins intl exactly, so this constraint has to track the
  # SDK in use. Flutter 3.32 on this workstation pins 0.20.2; the previous
  # ^0.19.0 came from a Flutter 3.29 machine and left `pub get` unresolvable
  # here. Only DateFormat/NumberFormat are used, unchanged across 0.19 → 0.20.
  intl: ^0.20.2
  uuid: ^4.5.1
  crypto: ^3.0.6
  http: ^1.2.2
  path_provider: ^2.1.5
  share_plus: ^10.1.2
  csv: ^6.0.0
  collection: ^1.18.0
  # 4.2.4+ requires AGP 8.13 / API 36 and Kotlin 2.2.20, which is not
  # compatible with this Flutter 3.29 Android toolchain. 4.2.3 includes the
  # Android TTS reconnect fixes without forcing that toolchain migration.
  flutter_tts: 4.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  # On-device tests. Receipt OCR can only be verified for real against the
  # actual ML Kit model on a device — see integration_test/receipt_ocr_test.dart.
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  fake_cloud_firestore: ^3.1.0
  firebase_auth_mocks: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/illustrations/
    # Ships the typeface with the app. google_fonts finds files here by name
    # and skips its runtime download, so a cold start never waits on
    # fonts.gstatic.com. Keep the filenames exactly as google_fonts expects.
    - assets/google_fonts/
