name: Build FinGenius AI APK

# Builds a debug-signed APK in the cloud and uploads it as a downloadable
# artifact. No local Flutter install needed — download the APK from the
# workflow run's "Artifacts" section, then sideload it onto your phone.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: fingenius_ai
        run: |
          flutter --version
          flutter pub get

      - name: Analyze (non-blocking)
        working-directory: fingenius_ai
        run: flutter analyze || true

      - name: Run unit tests (non-blocking)
        working-directory: fingenius_ai
        run: flutter test || true

      - name: Build release APK (debug-signed)
        working-directory: fingenius_ai
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fingenius-ai-apk
          path: fingenius_ai/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
