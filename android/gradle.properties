org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
# Gradle 8.10.2 / AGP 8.7.3 accept Java 17–23. This workstation also has JDK 25
# and 26 installed, which Gradle 8.10 rejects outright, so the build JDK is
# pinned to the JDK 21 LTS present here instead of following JAVA_HOME. This
# replaces a hard-coded Windows jdk-23 path that cannot resolve on macOS.
org.gradle.java.home=/Users/shenelimunasinghe/Library/Java/JavaVirtualMachines/jbr-21.0.11/Contents/Home
# Kotlin incremental compilation stays off for deterministic CLI/IDE builds.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=2
android.useAndroidX=true
android.enableJetifier=true
